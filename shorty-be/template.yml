AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Url Shortener Serverless - SAM Native Url

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"

Resources:

  UrlShortenerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: url_shortener_db
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiration_at
        Enabled: true

  ShortenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: target/shorty-be-1.0.0-lambda-package.zip
      Handler: it.shorty.StreamLambdaHandler::handleRequest
      Runtime: java21

      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live

      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "http://localhost:4200"
            - "https://lorenzofratini1998.github.io"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlShortenerTable

      Environment:
        Variables:
          TABLE_NAME: !Ref UrlShortenerTable
          MAIN_CLASS: it.shorty.ShortyBeApplication

Outputs:
  ShortenerFunctionUrl:
    Description: "Lambda Function URL (SnapStart Enabled)"
    Value: !GetAtt ShortenerFunctionUrl.FunctionUrl