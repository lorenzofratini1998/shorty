name: Deploy Angular Frontend

on:
  push:
    branches:
      - master
    paths:
      - 'shorty-fe/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'shorty-fe/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./shorty-fe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: shorty-fe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production --base-href /shorty/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: shorty-fe/dist/shorty-fe/browser